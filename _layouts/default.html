<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="spotlights" aria-hidden="true"></div>
  <main class="stage">
    <p class="progress">{{ page.progress }}</p>
    <h1><span class="q">?</span> {{ page.heading }} <span class="q">?</span></h1>
    {{ content }}
  </main>
  <script src="{{ '/assets/js/escape.js' | relative_url }}"></script>
</body>
</html>
